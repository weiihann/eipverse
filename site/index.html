<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eipverse · improvement proposals across EVM chains</title>
<meta name="description" content="EIPs, BEPs, TIPs, MIPs, AIPs and OP Stack upgrades side by side, tagged by protocol layer, read from each chain's canonical sources.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%23111418'/%3E%3Ccircle cx='8' cy='8' r='3.2' fill='%238B9DFF'/%3E%3C/svg%3E">
<script>try { const t = localStorage.getItem('eipverse-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="mark" href="./" aria-label="eipverse home"><span class="mark-dot"></span>eipverse</a>
    <span class="sub">Track how each EVM chain evolves side by side</span>
    <nav class="tabs" id="tabs" aria-label="Views">
      <button data-view="proposals">Proposals</button>
      <button data-view="layers">By layer</button>
      <button data-view="diff">Chain diff</button>
      <button data-view="upgrades">Upgrades</button>
      <button data-view="sources">Sources</button>
    </nav>
    <button class="icon-btn" id="theme" aria-label="Toggle light or dark theme" title="Toggle theme"></button>
  </div>
</header>

<section class="filters" id="filters" aria-label="Filters">
  <label class="search search-main">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="q" type="search" placeholder="Search proposals by id, title, abstract, fork or tag" aria-label="Search proposals" autocomplete="off" spellcheck="false">
    <kbd>/</kbd>
  </label>
  <div class="ctls" id="ctls" aria-label="Filter controls">
    <button class="ctl" data-pop="chain" aria-haspopup="dialog" aria-expanded="false"></button>
    <button class="ctl" data-pop="layer" aria-haspopup="dialog" aria-expanded="false"></button>
    <button class="ctl" data-pop="status" aria-haspopup="dialog" aria-expanded="false"></button>
    <div class="seg seg-sm" id="kind" role="group" aria-label="Kind">
      <button data-v="protocol">Protocol</button><button data-v="app standard">App standards</button><button data-v="">Both</button>
    </div>
  </div>
  <div class="summary" id="summary"></div>
</section>

<main id="main">
  <section class="view" id="v-proposals">
    <div class="list-head" aria-hidden="true"><span>ID</span><span>Proposal</span><span>Layers</span><span>Fork</span><span>Status</span><span class="r">Date · source</span></div>
    <div class="list" id="list" role="list"></div>
    <button class="more" id="more" hidden></button>
  </section>
  <section class="view" id="v-layers" hidden>
    <div class="matrix-wrap"><table class="matrix" id="matrix"></table></div>
    <div id="side"></div>
  </section>
  <section class="view" id="v-upgrades" hidden><div class="ugrid" id="ugrid"></div></section>
  <section class="view" id="v-diff" hidden>
    <div class="diff-head" id="diff-head"></div>
    <div class="diff-ctl" id="diff-ctl">
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="dq" type="search" placeholder="Search dimensions and values" aria-label="Search the chain diff" autocomplete="off" spellcheck="false">
      </label>
      <div class="ctls">
        <button class="ctl" data-pop="dg" aria-haspopup="dialog" aria-expanded="false"></button>
      </div>
    </div>
    <div class="diff-wrap"><table class="diff" id="difft"></table></div>
    <p class="s-foot" id="diff-foot"></p>
  </section>
  <section class="view" id="v-sources" hidden><div class="sgrid" id="sgrid"></div></section>
</main>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" aria-label="Proposal detail" aria-hidden="true" tabindex="-1"></aside>

<footer class="foot" id="foot">

  <a href="https://x.com/weiihannng" target="_blank" rel="noopener" aria-label="@weiihannng on X" title="X"><svg viewBox="0 0 24 24" aria-hidden="true" class="brand"><path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z"/></svg></a>
</footer>
<script type="module" src="app.js"></script>

</body>
</html>
